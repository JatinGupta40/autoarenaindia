name: autoarenaindia-BE

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.1.0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: |
            {"github-oauth": {"github.com": "${{ secrets.SPACE_LAYOUT_BUILDER_TOKEN }}"}}
        run: composer install -n --ansi
      - run: vendor/bin/blt validate

  deploy_acquia_dev:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/test'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Set up Node.js 12
        uses: actions/setup-node@v3
        with:
          node-version: '12'

      - name: Configure SSH for Acquia
        env:
          ACQUIA_SSH_PRIVATE_KEY: ${{ secrets.ACQUIA_SSH_PRIVATE_KEY }}
        run: |
          test -n "$ACQUIA_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ACQUIA_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/acquia
          chmod 600 ~/.ssh/acquia
          ssh-keyscan svn-634.devcloud.hosting.acquia.com >> ~/.ssh/known_hosts
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host svn-634.devcloud.hosting.acquia.com
            IdentityFile ~/.ssh/acquia
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/acquia > /dev/null

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: |
            {"github-oauth": {"github.com": "${{ secrets.SPACE_LAYOUT_BUILDER_TOKEN }}"}}
        run: composer install -n --ansi

      - name: Deploy to Acquia
        run: vendor/bin/blt artifact:deploy --no-interaction --ansi -vvv
